bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6
bEnableEnhancedDeterminism=False

[/Script/Engine.CollisionProfile]
; "Weapon" trace channel: hits skeletal mesh physics bodies (for bone-accurate hits / headshots)
